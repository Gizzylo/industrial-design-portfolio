<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cindy Lopez — Industrial Design</title>
  <meta name="description" content="Industrial design portfolio of Cindy Lopez — product design, prototyping, and design for manufacture.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/style.css?v=108">
</head>
<body>
  <a class="skip-link" href="#work">Skip to work</a>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="nav__name" href="index.html" aria-label="Cindy Lopez — home">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <!-- C: 260 degrees of arc, opening to the right — also the face -->
          <path class="logo__c" d="M28.36 10.04 A13 13 0 1 0 28.36 29.96"/>
          <circle class="logo__eye" cx="15.4" cy="16.6" r="1.75"/>
          <circle class="logo__eye logo__eye--right" cx="24.2" cy="16.6" r="1.75"/>
          <!-- the closed eye, swapped in for the right one on hover -->
          <path class="logo__wink" d="M22.3 16.9 Q24.2 15.1 26.1 16.9"/>
          <path class="logo__smile" d="M14.2 22.4 Q20 27.6 25.8 22.4"/>
          <!-- tongue, unrolls from the corner of the mouth -->
          <path class="logo__tongue" d="M15.7 23.6 Q14.4 29.6 18.9 25.2 Z"/>
        </svg>
      </a>
      <ul class="nav__links">
        <li><a href="index.html" aria-current="page">Work</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- The page still needs exactly one h1 for search engines and screen
         readers, so it stays here, visually hidden. The work starts straight
         after it. -->
    <h1 class="visually-hidden">Cindy Lopez — Industrial Design</h1>

    <!-- PROJECTS — four slots. Duplicate an <article> to add a fifth.

         PLACEHOLDER IMAGES: the tiles use a flat dark-grey SVG. Swap each
         <img> for your own photo and write real alt text describing it. -->
    <section class="work" id="work" aria-label="Projects">
      <!-- Rows of side-by-side tiles with unequal widths. .project--wide is the
           dominant tile in its row; the emphasis alternates row to row. Add a
           row by copying a .project-row, or make a tile full width by putting
           it alone in its own row. -->
      <div class="grid">
        <div class="project-row">
          <article class="project project--wide">
            <div class="project__media">
              <img src="images/root-tile.jpg" width="1600" height="753"
                   decoding="async" alt="">
            </div>
            <div class="project__body">
              <h3 class="project__title"><a href="projects/project-one.html">ROOT</a></h3>
            </div>
          </article>

          <article class="project">
            <div class="project__media">
              <img src="Images Curbside/CURBSIDE_ROUND.25.png" width="3840" height="2160"
                   decoding="async" alt="">
            </div>
            <div class="project__body">
              <h3 class="project__title"><a href="projects/project-two.html">Curbside EV</a></h3>
            </div>
          </article>
        </div>

        <div class="project-row">
          <article class="project">
            <div class="project__media">
              <img src="images/placeholder-light-4x3.svg" width="1200" height="900"
                   loading="lazy" decoding="async" alt="">
              <span class="project__soon">Coming soon</span>
            </div>
            <div class="project__body">
              <h3 class="project__title"><a href="projects/project-three.html">Project Three</a></h3>
            </div>
          </article>

          <article class="project project--wide">
            <div class="project__media">
              <img src="images/placeholder-light-4x3.svg" width="1200" height="900"
                   loading="lazy" decoding="async" alt="">
              <span class="project__soon">Coming soon</span>
            </div>
            <div class="project__body">
              <h3 class="project__title"><a href="projects/project-four.html">Project Four</a></h3>
            </div>
          </article>
        </div>

        <!-- A fifth tile, alone in its row so it fills the full width. Gated
             instead of linked — see js/private-lock.js. Not real security:
             the password ships in that file. -->
        <div class="project-row">
          <article class="project project--locked">
            <div class="project__media">
              <img src="images/private-tile.jpg" width="900" height="900"
                   loading="lazy" decoding="async" alt="">
              <form class="project__lock" id="private-lock" method="post" action="/unlock" autocomplete="off">
                <div class="project__lock-row">
                  <label class="visually-hidden" for="private-password">Password</label>
                  <input type="password" id="private-password" name="password" placeholder="Password" required>
                  <button type="submit" aria-label="Unlock">&rarr;</button>
                </div>
                <p class="project__lock-error" id="private-error" hidden>Incorrect password — try again.</p>
              </form>
            </div>
          </article>
        </div>
      </div>
    </section>

  </main>
  <script src="js/reveal.js?v=90"></script>
  <script>
    // A wrong password comes back here with ?locked=1.
    if (location.search.indexOf('locked=1') !== -1) {
      var err = document.getElementById('private-error');
      if (err) err.hidden = false;
    }
  </script>
</body>
</html>
