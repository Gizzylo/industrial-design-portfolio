<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private — Cindy Lopez</title>
  <meta name="description" content="Private — Cindy Lopez.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="../../css/style.css?v=108">
</head>
<body>
  <a class="skip-link" href="#project">Skip to content</a>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="nav__name" href="../../index.html" aria-label="Cindy Lopez — home">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <!-- C: 260 degrees of arc, opening to the right — also the face -->
          <path class="logo__c" d="M28.36 10.04 A13 13 0 1 0 28.36 29.96"/>
          <circle class="logo__eye" cx="15.4" cy="16.6" r="1.75"/>
          <circle class="logo__eye logo__eye--right" cx="24.2" cy="16.6" r="1.75"/>
          <!-- the closed eye, swapped in for the right one on hover -->
          <path class="logo__wink" d="M22.3 16.9 Q24.2 15.1 26.1 16.9"/>
          <path class="logo__smile" d="M14.2 22.4 Q20 27.6 25.8 22.4"/>
          <!-- tongue, unrolls from the corner of the mouth -->
          <path class="logo__tongue" d="M15.7 23.6 Q14.4 29.6 18.9 25.2 Z"/>
        </svg>
      </a>
      <ul class="nav__links">
        <li><a href="../../index.html" aria-current="page">Work</a></li>
        <li><a href="../../about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="project" class="case">
    <!-- Shown until the password matches — see js/private-lock.js.
         Not real security: the password ships in that file. -->
    <div class="page-lock" id="page-lock">
      <p class="page-lock__eyebrow">Private</p>
      <h1 class="page-lock__title">This project is password protected</h1>
      <p class="page-lock__body">Enter the password to see both case studies.</p>
      <form id="page-lock-form" autocomplete="off">
        <label class="visually-hidden" for="page-lock-password">Password</label>
        <input type="password" id="page-lock-password" placeholder="Password" required>
        <button class="button" type="submit">Unlock</button>
      </form>
      <p class="page-lock__error" id="page-lock-error" hidden>Incorrect password — try again.</p>
    </div>

    <div id="project-content" hidden>
      <h1 class="visually-hidden">Private</h1>

      <!-- Two sub-projects, built the same way as the tiles on the home page. -->
      <section class="work" aria-label="Private sub-projects">
        <div class="grid">
          <div class="project-row">
            <article class="project">
              <div class="project__media">
                <img src="../../Images%20SB/web/hero-firefly.jpg" width="2400" height="2400"
                     loading="lazy" decoding="async" alt="">
              </div>
              <div class="project__body">
                <h3 class="project__title"><a href="private-a.html">SBSA - School Bus Stop Arm</a></h3>
              </div>
            </article>

            <article class="project">
              <div class="project__media">
                <img src="../../images/falcon-lite-hero.jpg" width="2400" height="1800"
                     loading="lazy" decoding="async" alt="Falcon Lite">
                <span class="project__soon project__soon--photo">Work in progress</span>
              </div>
            </article>
          </div>
        </div>
      </section>

      <section class="about-teaser">
        <p><a class="link-arrow" href="../../index.html">Back to all work</a></p>
      </section>
    </div>
  </main>
  <script src="../../js/reveal.js?v=90"></script>
  <script src="../../js/private-lock.js?v=91"></script>
  <script>
    PrivateLock.guardPage({
      lock: document.getElementById('page-lock'),
      content: document.getElementById('project-content'),
      form: document.getElementById('page-lock-form'),
      input: document.getElementById('page-lock-password'),
      error: document.getElementById('page-lock-error')
    });
  </script>
</body>
</html>
